<!doctype html>
<html lang="ro-MD">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#355744" />

    <title>Montaj mobilă și dulapuri Chișinău | [BUSINESS NAME]</title>
    <meta
      name="description"
      content="Servicii de montaj mobilă și specializare în dulapuri în Chișinău și alte localități din Republica Moldova. Montaj atent, comunicare clară, ofertă gratuită și fără obligații."
    />
    <link rel="canonical" href="https://example-montaj-mobila.md/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="[BUSINESS NAME]" />
    <meta property="og:title" content="Montaj mobilă și dulapuri | [BUSINESS NAME]" />
    <meta
      property="og:description"
      content="Montaj profesionist de dulapuri și mobilă la domiciliu, în Chișinău și alte localități din Republica Moldova. Solicitați o ofertă gratuită."
    />
    <!-- PLACEHOLDER: replace with a real 1200×630 JPG/PNG before launch;
         most social platforms do not render SVG Open Graph images. -->
    <meta property="og:image" content="https://example-montaj-mobila.md/og-image.svg" />
    <meta property="og:locale" content="ro_MD" />
    <meta property="og:url" content="https://example-montaj-mobila.md/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Montaj mobilă și dulapuri | [BUSINESS NAME]" />
    <meta
      name="twitter:description"
      content="Montaj profesionist de dulapuri și mobilă la domiciliu, în Chișinău și alte localități din Republica Moldova."
    />
    <meta name="twitter:image" content="https://example-montaj-mobila.md/og-image.svg" />

    <meta name="robots" content="index, follow" />

    <!-- Google Fonts: editorial serif for headings, readable sans-serif for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Progressive-enhancement flag: adds `js` to <html> as early as
      possible so scroll-reveal / sticky-story CSS only activates once we
      know JavaScript actually ran. Visitors without JavaScript keep the
      `no-js`-safe styles (see src/styles/global.css) and see all content
      immediately, without needing the animation to "finish".
    -->
    <script src="/early.js"></script>
    <!--
      STATIC FORM FOR NETLIFY BUILD-TIME DETECTION
      This site is a client-rendered React SPA, so the interactive form in
      src/components/Contact/Contact.tsx only exists in the DOM after
      JavaScript runs — Netlify's form-detection bot only parses the
      static HTML produced at build time, so it would never see that
      form. This hidden, unstyled duplicate exists purely so Netlify's
      build step registers the "solicitare-oferta" form (same name, same
      field names) and can route submissions/notifications correctly.
      It is never shown to users and never receives real input — the
      React form is what visitors actually fill in and submit via fetch()
      to this same form name. Keep the `name` attributes here in sync
      with the fields in Contact.tsx if either changes.
    -->
    <form name="solicitare-oferta" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="preferredContact" />
      <input type="text" name="location" />
      <input type="text" name="furnitureType" />
      <input type="text" name="brandModel" />
      <input type="text" name="itemCount" />
      <input type="text" name="preferredDate" />
      <textarea name="message"></textarea>
      <input type="text" name="privacyConsent" />
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>

    <!--
      NOSCRIPT FALLBACK
      This is a client-rendered React application, so the interactive
      sections (navigation, gallery lightbox, accordion, form) require
      JavaScript to render at all. To keep the site's essential
      information reachable without JavaScript — rather than a blank
      page — this block provides the core content and contact details
      directly in the HTML. Keep the text below in sync with
      src/config/business.ts if those values change. For strict no-JS
      support across the full page (not just this summary), consider
      adding static prerendering/SSG in front of this Vite build.
    -->
    <noscript>
      <div style="max-width: 640px; margin: 3rem auto; padding: 0 1.5rem; font-family: Georgia, serif; color: #252521;">
        <h1>[BUSINESS NAME] — Montaj mobilă și dulapuri</h1>
        <p>
          Montăm mobila cu grijă, ca să vă bucurați de ea fără bătăi de cap. Servicii de montaj
          pentru dulapuri, paturi, comode, rafturi și alt mobilier, în Chișinău și alte
          localități din Republica Moldova.
        </p>
        <p><strong>Telefon:</strong> [+373 NUMĂR DE TELEFON]</p>
        <p><strong>E-mail:</strong> [EMAIL ADDRESS]</p>
        <p><strong>WhatsApp:</strong> [WHATSAPP NUMBER]</p>
        <p><strong>Localitate de bază:</strong> [LOCALITATE — de exemplu, Chișinău]</p>
        <p>
          Această pagină necesită JavaScript pentru afișarea completă și interactivă. Vă rugăm
          să ne contactați direct prin telefon, e-mail sau WhatsApp folosind datele de mai sus.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
